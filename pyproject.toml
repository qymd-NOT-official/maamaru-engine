[project]
name = "maamaru-engine"
version = "1.3.1"
description = "《刀剑乱舞 ONLINE》国服本丸管家与纯净本丸账房"
requires-python = ">=3.12"
license = {text = "AGPL-3.0-or-later"}
keywords = ["touken-ranbu", "honmaru", "ledger", "maa", "automation"]
dependencies = [
    "maafw>=5.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pywebview>=5.0",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pillow>=10.0",
    "openpyxl>=3.1",
    "websocket-client>=1.8",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["touken"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
