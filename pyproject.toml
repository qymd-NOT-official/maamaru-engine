[project]
name = "maamaru-engine"
version = "1.3.8"
description = "《刀剑乱舞 ONLINE》国服本丸管家与纯净本丸账房"
requires-python = ">=3.12"
license = {text = "AGPL-3.0-or-later"}
keywords = ["touken-ranbu", "honmaru", "ledger", "automation"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pywebview>=5.0",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pillow>=10.0",
    "openpyxl>=3.1",
    "websocket-client>=1.8",
    # 日服画面文字识别。注意：它会拖进完整版 opencv-python，与本项目
    # 钉死的 headless 版撞 cv2 目录——装依赖后必须卸掉完整版再重装
    # headless（release 流水线已内置这一步；本机开发装一次即可）。
    "rapidocr_onnxruntime>=1.4",
    "onnxruntime>=1.17",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["touken"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
