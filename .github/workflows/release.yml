name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: 构建新版面板
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: 获取版本号
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $project = Get-Content -Raw -LiteralPath "pyproject.toml"
            if ($project -notmatch '(?m)^version\s*=\s*"([^"]+)"') {
              throw "无法从 pyproject.toml 读取版本号"
            }
            $tag = "v$($Matches[1])"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $version = $tag.TrimStart("v")
          "CURRENT_VERSION = `"$version`"" | Set-Content -LiteralPath "launcher/version.py" -Encoding utf8

      - name: 检查识别资源
        shell: pwsh
        run: |
          $required = @(
            "resource/base/model/ocr/rec.onnx",
            "resource/base/model/ocr/det.onnx",
            "resource/base/image/登录.png"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) { throw "缺少发布资源：$path" }
          }

      - name: 生成发布清单
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.tag }}".TrimStart("v")
          $inputs = @(
            "resource",
            "profiles",
            "panel/static",
            "touken_config.example.json",
            "panel/panel_config.example.json",
            "panel/expedition_schedule.json"
          )
          $files = foreach ($inputPath in $inputs) {
            if (Test-Path -LiteralPath $inputPath -PathType Container) {
              $items = Get-ChildItem -LiteralPath $inputPath -Recurse -File
            } else {
              $items = Get-Item -LiteralPath $inputPath
            }
            foreach ($item in $items) {
              [ordered]@{
                path = $item.FullName.Substring($PWD.Path.Length + 1).Replace("\", "/")
                size = $item.Length
                sha256 = (Get-FileHash -LiteralPath $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              }
            }
          }
          $manifest = [ordered]@{
            product = "Maamaru"
            version = $version
            data_schema = 1
            minimum_data_schema = 1
            files = @($files | Sort-Object path)
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath "manifest.json" -Encoding utf8

      - name: 检查发布包不含本机配置
        shell: pwsh
        run: |
          $config = Get-Content -Raw -LiteralPath "touken_config.example.json" | ConvertFrom-Json
          if ($config.adb_path -or $config.emulator_manager) {
            throw "公开配置模板含有本机模拟器路径"
          }
          if ($config.notify.enabled -or $config.notify.topic) {
            throw "公开配置模板含有个人通知设置"
          }
          $forbidden = @("touken_config.json", "panel_config.json", "Netease", "status", "debug")
          foreach ($path in $forbidden) {
            if (Test-Path -LiteralPath $path) { throw "发布工作区出现本机文件：$path" }
          }

      - name: 安装构建依赖
        run: python -m pip install ".[test]" pyinstaller

      - name: 运行完整测试
        # windows-latest 控制台是 cp1252，裸 print 中文会炸；
        # ubuntu 的 Check 流水线没这问题，这里必须显式 UTF-8
        run: python -m pytest tests -q
        env:
          PYTHONIOENCODING: utf-8

      - name: 构建启动器
        run: python -m PyInstaller --clean --noconfirm "まあ丸启动器.spec"

      - name: 检查成品不含用户数据
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          $archive = & pyi-archive_viewer -l "dist/まあ丸启动器/まあ丸启动器.exe" | Out-String
          $forbidden = @(
            "'panel\\panel_config.json'",
            "'panel_config.json'",
            "'touken_config.json'",
            "'expedition_schedule.json'"
          )
          foreach ($entry in $forbidden) {
            if ($archive.Contains($entry)) { throw "发布成品混入用户数据：$entry" }
          }
          $modules = & pyi-archive_viewer -r -b "dist/まあ丸启动器/まあ丸启动器.exe" | Out-String
          foreach ($required in @("launcher.updater", "launcher.update_apply", "launcher.light_update")) {
            if (-not $modules.Contains($required)) { throw "发布成品缺少更新安全模块：$required" }
          }

      - name: 打包启动器
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $exe = "dist/まあ丸启动器/まあ丸启动器.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "启动器构建失败：没有生成 $exe" }
          $package = "dist/package"
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item -Path "dist/まあ丸启动器/*" -Destination $package -Recurse
          Copy-Item -LiteralPath "manifest.json" -Destination $package
          python scripts/build_light_update.py $package dist ($tag.TrimStart("v"))
          if ($LASTEXITCODE -ne 0) { throw "轻量更新包生成失败" }
          Compress-Archive -Path "$package/*" -DestinationPath "dist/maamaru-launcher-$tag.zip" -Force

      - name: 验证轻量更新与失败恢复
        run: python scripts/smoke_test_light_update.py dist/package
        env:
          PYTHONUTF8: "1"

      - name: 安装 Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: 构建安装器
        shell: pwsh
        env:
          MAAMARU_VERSION: ${{ steps.version.outputs.tag }}
          MAAMARU_PACKAGE_DIR: ${{ github.workspace }}\dist\package
        run: |
          $env:MAAMARU_VERSION = $env:MAAMARU_VERSION.TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\maamaru.iss"
          $setup = "dist/maamaru-setup-${{ steps.version.outputs.tag }}.exe"
          if (-not (Test-Path -LiteralPath $setup)) { throw "安装器构建失败：没有生成 $setup" }

      - name: 验证安装、首次启动与卸载
        shell: pwsh
        run: |
          ./scripts/smoke_test_installer.ps1 `
            -InstallerPath "dist/maamaru-setup-${{ steps.version.outputs.tag }}.exe"

      - name: 保留安装冒烟诊断
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-smoke-diagnostics
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/maamaru-installer-smoke/*.log
            ${{ runner.temp }}/maamaru-installer-smoke/result.json
            ${{ runner.temp }}/maamaru-installer-smoke/user-localappdata/Maamaru/logs/**

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: まあ丸 ${{ steps.version.outputs.tag }}
          tag_name: ${{ steps.version.outputs.tag }}
          overwrite_files: true
          body_path: docs/releases/${{ steps.version.outputs.tag }}.md
          files: |
            dist/maamaru-launcher-${{ steps.version.outputs.tag }}.zip
            dist/maamaru-setup-${{ steps.version.outputs.tag }}.exe
            dist/maamaru-update-${{ steps.version.outputs.tag }}-*.zip
